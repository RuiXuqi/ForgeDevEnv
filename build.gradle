// It is advised to not edit this file directly, in order to update script easily.
// Instead, edit gradle/scripts/extra.gradle to customize the build.
import groovy.json.JsonOutput
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'net.neoforged.moddev.mcpforge' version '2.0.183-legacy'
    id 'net.kyori.blossom' version '2.2.0'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

apply from: 'gradle/scripts/helpers.gradle'

if (propertyBool('enable_shadow')) {
    apply plugin: 'com.gradleup.shadow'
}

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_booter_version', 'mixin_refmap'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'

setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'enable_shadow', false, false
setDefaultProperty 'minecraft_username', true, 'Dev'
setDefaultProperty 'extra_jvm_args', false, ''

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = propertyString('mod_id')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(propertyBool('use_modern_java_syntax') ? 16 : 8)
        // Azul covers the most platforms for Java 8 toolchains, crucially including MacOS arm64
        vendor = JvmVendorSpec.AZUL
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

boolean useMixins = propertyBool('use_mixins')
def mixinConfigs = propertyStringList('mixin_configs', ',')

configurations {
    if (propertyBool('enable_shadow')) {
        shaded
        implementation.extendsFrom(shaded)
    }
}

String reobfTaskName = 'reobfJar'

if (propertyBool('enable_shadow')) {
    def reobfShadowJar = obfuscation.reobfuscate(tasks.named('shadowJar'), sourceSets.main)
    reobfTaskName = reobfShadowJar.name
    tasks.named('assemble').configure {
        dependsOn reobfShadowJar
    }
}

def mixinBooter = "zone.rong:mixinbooter:${propertyString('mixin_booter_version')}"

mcpForge {
    if (propertyBool('use_access_transformer')) {
        accessTransformers.from(propertyStringList('access_transformer_locations').collect {
            "src/main/resources/${it}"
        })
    }

    if (useMixins) {
        mixinProvider mixinBooter
    }

    enable {
        forgeVersion = "1.12.2-14.23.5.2860"
        mcpMappings = 'de.oceanlabs.mcp:mcp_stable:39-1.12@zip'
        obfuscateJar = !propertyBool('enable_shadow')
    }

    runs {
        configureEach {
            programArguments.addAll('--username', propertyString('minecraft_username'))
            def extraArgs = propertyString('extra_jvm_args')
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                extraArgs.trim().split(/\s+/).each { jvmArgument(it) }
            }
            if (propertyBool('is_coremod')) {
                systemProperty("fml.coreMods.load", propertyString('coremod_plugin_class_name'))
            }
        }
        client {
            client()
            disableIdeRun()
        }
        server {
            server()
            disableIdeRun()
            systemProperty 'fml.queryResult', 'confirm'
        }
    }

    mods {
        create(propertyString('mod_id')) {
            sourceSet(sourceSets.main)
        }
    }
}

if (propertyBool('use_mixins')) {
    mixin {
        mixinConfigs.each { config(it) }
        String refmap = propertyString('mixin_refmap')
        if (!refmap.isBlank()) {
            add refmap
        }
    }
}

// Do not configure your deps here!
// Check gradle/scripts/dependencies.gradle for that.
dependencies {
    if (propertyBool('use_modern_java_syntax')) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        // Workaround for https://github.com/bsideup/jabel/issues/174
        annotationProcessor 'net.java.dev.jna:jna-platform:5.19.1'
        compileOnly ('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false
        }
        // Include for tests
        testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        testCompileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false // We only care about the 1 annotation class
        }
    }
    if (propertyBool('use_jetbrains_annotations')) {
        compileOnly 'org.jetbrains:annotations:26.1.0'
    }
    if (useMixins) {
        modImplementation (mixinBooter) {
            transitive = false
        }
        annotationProcessor mixinBooter
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', propertyString('mod_id'))
                property('mod_name', propertyString('mod_name'))
                property('mod_version', propertyString('mod_version'))
            }
            resources {
                property('mod_id', propertyString('mod_id'))
                property('mod_name', propertyString('mod_name'))
                property('mod_version', propertyString('mod_version'))
                property('mod_description', propertyString('mod_description'))
                property('mod_authors', propertyStringList('mod_authors', ',').collect {it.strip()}.join('", "'))
                property('mod_credits', propertyString('mod_credits'))
                property('mod_license', propertyString('mod_license'))
                property('mod_url', propertyString('mod_url'))
                property('mod_issue_tracker_url', propertyString('mod_issue_tracker_url'))
                property('mod_update_json', propertyString('mod_update_json'))
                property('mod_icon_item', propertyString('mod_icon_item'))
                property('mod_logo_path', propertyString('mod_logo_path'))
                property('mod_icon_path', propertyString('mod_icon_path'))
                property('mod_background_path', propertyString('mod_background_path'))
            }
        }
    }
}

jar {
    archiveClassifier = propertyBool('enable_shadow') ? 'plain' : ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doFirst {
        manifest {
            def attribute_map = [:]
            if (useMixins) {
                if (!mixinConfigs.isEmpty()) {
                    attribute_map['MixinConfigs'] = mixinConfigs.join(',')
                }
                def mixinConnectorClass = propertyString('mixin_connector_class')
                if (!mixinConnectorClass.isEmpty()) {
                    attribute_map['MixinConnector'] = mixinConnectorClass
                }
            }
            if (propertyBool('is_coremod')) {
                attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
                if (propertyBool('coremod_includes_mod')) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (propertyBool('use_access_transformer')) {
                attribute_map['FMLAT'] = propertyString('access_transformer_locations')
            }
            attributes(attribute_map)
        }
    }
}

if (propertyBool('enable_shadow')) {
    // Shade deps to the dev jar, so the normal dev jar will contain deps
    shadowJar {
        archiveClassifier = ''
        //noinspection GroovyAssignabilityCheck,GroovyAccessibility
        configurations = [ project.configurations.shaded ]
    }
    tasks.named('jar').configure {
        finalizedBy shadowJar
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "0. Create Artifacts"(Gradle) {
                    taskNames = ["createMinecraftArtifacts"]
                }
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Build Mod"(Gradle) {
                    taskNames = ["build"]
                }
                "4. Apply Spotless"(Gradle) {
                    taskNames = ["spotlessApply"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.register('generateMixinJson') {
    group = 'build setup'
    description = 'Generates a Mixin configuration JSON file if missing.'
    onlyIf {
        useMixins
    }
    doLast {
        def missingConfigs = mixinConfigs.findAll { configName ->
            !file("src/main/resources/${configName}").exists()
        }
        if (missingConfigs.isEmpty()) {
            logger.lifecycle('No missing Mixin JSON files.')
            return
        }
        missingConfigs.each { configName ->
            def configFile = file("src/main/resources/${configName}")
            configFile.parentFile.mkdirs()
            def config = [
                    'package': '',
                    'refmap': propertyString('mixin_refmap'),
                    'required': true,
                    'target': '@env(DEFAULT)',
                    'minVersion': '0.8.7',
                    'compatibilityLevel': 'JAVA_8',
                    'mixins': [],
                    'server': [],
                    'client': [],
                    'setSourceFile': true
            ]
            configFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(config)) + '\n', 'UTF-8')
            logger.lifecycle("Generated Mixin JSON: ${configFile}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax')) {
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

if (propertyBool('use_modern_java_syntax')) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
